<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Keep this work-in-progress out of search results; the link still works
       for anyone you share it with. Remove when you're ready to be found. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>KindQuest 🌿</title>
  <link rel="stylesheet" href="styles.css?v=28" />
</head>
<body>
  <div id="app">

    <!-- Voice on/off — Clover reads her lines aloud for pre-readers -->
    <button id="tts-btn" class="tts-btn" aria-label="Turn voice off">🔊</button>

    <!-- ── Screen 1: Gameboard ─────────────────────────────────────────── -->
    <section id="board-screen" class="screen active">
      <h1 class="title">KindQuest</h1>
      <p class="subtitle">Pick a rescued friend to meet 🌿</p>
      <div id="board" class="board"><!-- animal tiles injected here --></div>
    </section>

    <!-- ── Screen 2: Meet & interact ───────────────────────────────────── -->
    <section id="play-screen" class="screen">
      <button class="back-btn" data-nav="board">← Friends</button>

      <div class="stage">
        <div id="goat-stage" class="goat-stage"><!-- SVG injected here --></div>
        <div id="speech" class="speech"></div>
      </div>

      <div id="trust-meter" class="trust-meter" aria-label="Friendship meter"></div>

      <div id="choices" class="choices">
        <button class="choice" data-action="ask">
          <span class="choice-emoji">💬</span><span>Ask</span>
        </button>
        <button class="choice" data-action="pet">
          <span class="choice-emoji">🤚</span><span>Pet</span>
        </button>
        <button class="choice" data-action="brush">
          <span class="choice-emoji" aria-hidden="true">
            <svg class="brush-icon" viewBox="0 0 40 40" width="34" height="34" xmlns="http://www.w3.org/2000/svg">
              <!-- bristles -->
              <g stroke="#d9b676" stroke-width="2.4" stroke-linecap="round">
                <line x1="9" y1="25" x2="9" y2="35"/><line x1="14" y1="25" x2="14" y2="36"/>
                <line x1="19" y1="25" x2="19" y2="36"/><line x1="24" y1="25" x2="24" y2="36"/>
                <line x1="29" y1="25" x2="29" y2="35"/>
              </g>
              <!-- wooden body -->
              <rect x="5" y="13" width="29" height="13" rx="6.5" fill="#a9743b"/>
              <rect x="5" y="13" width="29" height="13" rx="6.5" fill="none" stroke="#8a5d2e" stroke-width="1.5"/>
              <!-- hand strap -->
              <path d="M12,15 q7.5,-11 15,0" fill="none" stroke="#6b4a2b" stroke-width="3.2" stroke-linecap="round"/>
            </svg>
          </span><span>Brush</span>
        </button>
        <button class="choice" data-action="leave">
          <span class="choice-emoji">🌿</span><span>Give space</span>
        </button>
      </div>

      <!-- Question chips, revealed when the child taps "Ask" -->
      <div id="ask-panel" class="ask-panel hidden">
        <p class="ask-panel-title">What would you like to ask Clover?</p>
        <div id="play-questions" class="play-questions"></div>
      </div>

      <!-- Shown after the child wins the round -->
      <div id="win-panel" class="win-panel hidden">
        <div class="stars">⭐ ⭐ ⭐</div>
        <p class="win-text"></p>
        <div class="win-actions">
          <button class="big-btn adopt-btn" data-action="adopt">💛 Adopt <span class="aname"></span></button>
          <button class="big-btn ghost-btn" data-action="again">↺ Play again</button>
        </div>
      </div>
    </section>

    <!-- ── Screen 3: Adopted + Q&A ─────────────────────────────────────── -->
    <section id="adopt-screen" class="screen">
      <button class="back-btn" data-nav="board">← Friends</button>

      <div class="cert">
        <div class="cert-badge">💛 Adoption Certificate 💛</div>
        <div id="cert-goat" class="cert-goat"></div>
        <p class="cert-line">You adopted <strong class="aname"></strong>!</p>
        <p class="cert-sub">Ask <span class="aname"></span> anything about herself 👇</p>
      </div>

      <div id="chat" class="chat"><!-- Q&A bubbles --></div>

      <div class="ask-row">
        <input id="ask-input" class="ask-input" type="text"
               placeholder="Ask a question…" autocomplete="off" />
        <button id="ask-send" class="ask-send">Ask</button>
      </div>
      <div id="suggestions" class="suggestions"></div>
    </section>

  </div>

  <script src="data/animals.js?v=28"></script>
  <script src="data/supabase-config.js?v=28"></script>
  <script src="data/art.js?v=28"></script>
  <script src="data/tts.js?v=28"></script>
  <script src="data/fx.js?v=28"></script>
  <script src="data/memory.js?v=28"></script>
  <script src="data/db.js?v=28"></script>
  <script src="data/brain.js?v=28"></script>
  <script src="app.js?v=28"></script>
</body>
</html>
